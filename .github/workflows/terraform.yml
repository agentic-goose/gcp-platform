name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root (e.g. environments/dev or bootstrap)
        required: true
        type: string
      apply:
        description: If true, apply the saved plan (caller should gate this to main)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_app_repo_id: ${{ vars.APP_REPO_ID }}
      TF_VAR_wif_pool_name: ${{ vars.GCP_WIF_POOL }}
      TF_VAR_terraform_ci_service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      TF_VAR_github_reviews_repo_id: ${{ vars.REVIEWS_REPO_ID }}
      TF_VAR_github_org_id: ${{ vars.GITHUB_ORG_ID }}
      TF_VAR_github_infra_repo_id: ${{ vars.INFRA_REPO_ID }}
      TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const marker = '<!-- terraform-plan -->';
            const plan = process.env.PLAN || '(empty plan output)';
            const truncated =
              plan.length > 55000 ? `${plan.slice(0, 55000)}\n...truncated...` : plan;
            const body = `${marker}
            #### Terraform \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };
            if (existing) {
              await github.rest.issues.updateComment({
                ...payload,
                comment_id: existing.id,
              });
            } else {
              await github.rest.issues.createComment({
                ...payload,
                issue_number: context.issue.number,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: inputs.apply
        run: terraform apply -auto-approve tfplan
