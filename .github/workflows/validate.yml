name: Validate modules

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Calls the Hosting action rather than linting it. Nothing else in this repo
  # exercises a composite action, so until now the only thing that discovered
  # a broken one was a caller's failing deploy. deploy=false does not
  # authenticate, so this needs no credentials and publishes nothing.
  hosting-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Accept a built site
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          config: firebase.json
          deploy: "false"
          project_id: fixture-project
          workload_identity_provider: unused
          service_account: unused
          working-directory: .github/fixtures/hosting-site

      - name: Refuse a config whose public directory was never built
        id: unbuilt
        continue-on-error: true
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          config: firebase.unbuilt.json
          deploy: "false"
          project_id: fixture-project
          workload_identity_provider: unused
          service_account: unused
          working-directory: .github/fixtures/hosting-site

      - name: Refuse a config that does not exist
        id: absent
        continue-on-error: true
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          config: no-such-firebase.json
          deploy: "false"
          project_id: fixture-project
          workload_identity_provider: unused
          service_account: unused
          working-directory: .github/fixtures/hosting-site

      # Without this the two cases above would pass by being skipped, which is
      # the failure mode continue-on-error invites.
      - name: Both bad configs must have failed
        env:
          UNBUILT: ${{ steps.unbuilt.outcome }}
          ABSENT: ${{ steps.absent.outcome }}
        run: |
          set -euo pipefail
          status=0
          for case in UNBUILT ABSENT; do
            outcome="${!case}"
            if [ "${outcome}" != "failure" ]; then
              echo "${case} was expected to fail; outcome was ${outcome}" >&2
              status=1
            fi
          done
          exit "${status}"

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/bootstrap
          - modules/artifact-registry
          - modules/cloud-run-app
          - modules/secrets
          - modules/monitoring
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init and validate
        working-directory: ${{ matrix.module }}
        run: |
          terraform init -backend=false
          terraform validate

      # Mutation testing showed this is the one property nothing else guards:
      # A module must not decide something irreversible for a caller that said
      # nothing. Two variables have earned that treatment so far, for the same
      # reason in opposite domains:
      #
      #   invoker_iam_disabled — one default publishes a service by omission,
      #     the other revokes it by omission.
      #   cleanup_policies     — one default deletes images by omission, the
      #     other lets a registry grow by omission. The first of those was
      #     caught about to delete the images a production environment was
      #     running, thirty-one days after its last deploy.
      #
      # Neither is expressible as a terraform test: expect_failures covers
      # validation blocks and pre/postconditions, while a missing required
      # variable is a configuration error that fails the run rather than
      # reporting a checkable object. So the check reads variables.tf.
      #
      # A list, not a copied step. The step below carries a comment about a
      # hardcoded module path that would have left a second module's tests
      # written and never run; a second hardcoded step here is that same shape.
      - name: Check nothing irreversible can be inherited by omission
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          [ -f variables.tf ] || exit 0
          status=0
          for name in invoker_iam_disabled cleanup_policies; do
            block=$(awk -v n="$name" '$0 ~ "^variable \"" n "\"" {f=1} f&&/^\}/{f=0;print;next} f' variables.tf)
            if [ -z "${block}" ]; then
              echo "No ${name} in ${{ matrix.module }}; nothing to check."
              continue
            fi
            if printf '%s\n' "${block}" | grep -qE '^[[:space:]]*default[[:space:]]*='; then
              echo "::error::${name} must have no default in ${{ matrix.module }}. Both directions change behaviour for a caller that said nothing, so the caller has to state which it wants." >&2
              status=1
            else
              echo "${name} is required, as intended."
            fi
          done
          exit "${status}"

      # Named by presence, not by module. The previous step hardcoded
      # modules/monitoring, so a second module's tests would have been written
      # and never run — the same shape as the app repo's orphaned suite.
      - name: Test module plans
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          if [ -d tests ] && ls tests/*.tftest.hcl >/dev/null 2>&1; then
            terraform test
          else
            echo "No tests/*.tftest.hcl in ${{ matrix.module }}; nothing to run."
          fi
